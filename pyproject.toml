[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "quantum-classical-recognition-validation"
version = "0.1.0rc1"
description = "Bounded public validation package for a multi-ledger operator-memory quantum representation benchmark."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  {name = "Parveen Dabas"}
]
license = {file = "LICENSE"}
dependencies = []

[project.optional-dependencies]
hardware = [
  "qiskit==2.5.0",
  "qiskit-ibm-runtime==0.47.0"
]

[tool.setuptools]
py-modules = []
